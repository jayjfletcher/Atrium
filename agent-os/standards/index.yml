# Agent OS Standards Index

architecture:
  actions-events:
    description: "Action execute()/handle() split; starting + finished ActionEvent pair per action; DB::transaction in perform(); finished events after commit; concrete return types; no model constructor DI"
  request-persist:
    description: "FormRequests own validation, policy authorization (allows/allowsEach) and work via abstract persist(); controllers collapse to return $request->persist(); actions do the writing, never controllers"

models:
  lifecycle-events:
    description: "DispatchesModelEvents trait maps every Eloquent hook to Events\\Model\\{Model}{Hook}Event implementing ModelLifecycleEvent; lifecycle events for data concerns, ActionEvents for business logic"
