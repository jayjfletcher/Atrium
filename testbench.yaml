laravel: '@testbench'

env:
  - APP_NAME="Acme Shop"

providers:
  - RefactorCircus\Atrium\AtriumServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  # The seeded admin is signed in through /_workbench. Testbench checks for a
  # user at `/` before the session starts, so a start of `/` would loop.
  start: '/atrium'
  user: admin@example.com
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: true
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  # Republished on every build, so the served dashboard always uses the
  # freshly compiled public/atrium.css and atrium.js.
  assets:
    - laravel-assets
    - atrium-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
